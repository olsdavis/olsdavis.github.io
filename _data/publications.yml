- title: "SOAPIA"
  selected: false
  url: "https://openreview.net/pdf?id=aRrXs2cVdy"
  authors: "Vincoff, S.*, Davis, O.*, Ceylan, İ., Tong, A., Bose, J., Chatterjee, P."
  abstract: >
    Therapeutic molecules must selectively interact with a target protein while avoiding structurally or functionally similar off-targets. However, no existing generative strategy explicitly optimizes both target affinity and off-target avoidance. To address this, we introduce SOAPIA, a framework for the Siamese-guided generation of Off-target-Avoiding Protein Interactions with high target Affinity. SOAPIA generates de novo peptide binders by steering the generative process of a Diffusion Protein Language Model (DPLM) using a multi-objective Monte Carlo Tree Search (MCTS). Affinity is optimized via a pre-trained predictor, while specificity is enforced using a Siamese model trained with an adaptive Log-Sum-Exp Decoy Loss. This dual-guidance scheme enables Pareto-efficient exploration of discrete sequence space without gradient access. In benchmarks across 17 fusion oncoproteins, SOAPIA consistently identifies binders with strong affinity and high selectivity. For multiple clinically relevant targets, SOAPIA generated peptides that preferentially bind the fusion by engaging both its head and tail domains, while avoiding the wild-type counterparts. These results underscore SOAPIA's promise for designing safe, specific biologics for fusion-driven cancers and other rare, currently untreatable diseases.
  meta:
    - "ICML 2025 FM4LS"
  links:
    - label: "OpenReview"
      url: "https://openreview.net/pdf?id=Ax25SLlDsN"
  image: "/assets/soapia_results.png"
  image_alt: "SOAPIA results."

- title: "SOAPI"
  selected: false
  url: "https://openreview.net/pdf?id=mUp7mfNfXz"
  authors: "Vincoff, S., Davis, O., Tong, A., Bose, J., Chatterjee, P."
  abstract: >
    Therapeutics that modulate pathogenic proteins while avoiding off-target
    interactions are essential for effective drug design. However, designing binders that
    selectively engage a target protein while minimizing interactions with structurally
    or functionally similar proteins remains a major challenge. To address this, we
    introduce a Siamese-guided strategy for the generation of Off target-Avoiding
    Protein Interactions, termed SOAPI. SOAPI leverages a Siamese protein language
    model with an adaptive Log-Sum-Exp Decoy Loss to enforce specificity by
    embedding fusion-specific binders close to their target while maintaining separation
    from off-targets. These optimized embeddings then guide a diffusion protein
    language model (DPLM), which generates binders using soft-value-based decoding
    (SVDD) and Sequential Monte Carlo resampling to iteratively refine candidates.
    In silico validation demonstrates significant off-target avoidance, highlighting
    SOAPI's potential for generating precise and selective protein interactions.
  meta:
    - "ICML 2025 FM4LS"
