- title: "Fisher Flow Matching for Generative Modeling over Discrete Data"
  selected: true
  url: "https://arxiv.org/abs/2405.14664"
  authors: "Davis, O., Kessler, S., Petrache, M., Ceylan, İ., Bronstein, M., Bose, J."
  abstract: >
    Generative modeling over discrete data has recently seen numerous success
    stories, with applications spanning language modeling, biological sequence
    design, and graph-structured molecular data. The predominant generative
    modeling paradigm for discrete data is still autoregressive, with more
    recent alternatives based on diffusion or flow-matching falling short of
    their impressive performance in continuous data settings, such as image or
    video generation. In this work, we introduce Fisher-Flows, a novel
    flow-matching model for discrete data. Fisher-Flows takes a manifestly
    geometric perspective by considering categorical distributions over discrete
    data as points residing on a statistical manifold equipped with its natural
    Riemannian metric: the Fisher-Rao metric. As a result, we demonstrate that
    discrete data itself can be continuously reparameterised to points on the
    positive orthant of the \(d\)-hypersphere \(\mathbb{S}^d_+\), which allows
    us to define flows that map any source distribution to target in a
    principled manner by transporting mass along (closed-form) geodesics of
    \( \mathbb{S}^d_+ \). Furthermore, the learned flows in Fisher-Flows can be
    further bootstrapped by leveraging Riemannian optimal transport leading to
    improved training dynamics. We prove that the gradient flow induced by
    Fisher-Flows is optimal in reducing the forward KL divergence. We evaluate
    Fisher-Flows on an array of synthetic and diverse real-world benchmarks,
    including designing DNA Promoter, and DNA Enhancer sequences. Empirically,
    we find that Fisher-Flows improves over prior diffusion and flow-matching
    models on these benchmarks.
  meta:
    - "NeurIPS 2024"
